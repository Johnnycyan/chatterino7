name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: SevenTV/chatterino7
  UPSTREAM_BRANCH: chatterino7
  TARGET_BRANCH: chatterino7
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    if: github.repository == 'Johnnycyan/chatterino7'
    runs-on: ubuntu-latest
    steps:
      # Upstream regularly edits .github/workflows, which GITHUB_TOKEN is not
      # allowed to push. UPSTREAM_SYNC_TOKEN must be a PAT with `repo` and
      # `workflow` scopes (or a fine-grained token with Contents, Pull requests
      # and Workflows write). Pushing with a PAT also triggers the build CI.
      - name: Check token
        env:
          TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret UPSTREAM_SYNC_TOKEN is not set"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream
        id: merge
        run: |
          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "Behind upstream by ${behind} commit(s)"
          if [ "$behind" -eq 0 ]; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"

          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}" \
               -m "Merge remote-tracking branch 'upstream/${UPSTREAM_BRANCH}' into ${TARGET_BRANCH}"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            {
              echo "conflicts<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge
        if: steps.merge.outputs.result == 'merged'
        run: git push origin "HEAD:${TARGET_BRANCH}"

      - name: Open PR for conflicts
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          BEHIND: ${{ steps.merge.outputs.behind }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          git push --force origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${SYNC_BRANCH}"

          body=$(cat <<EOF
          Automatic merge of \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` (${BEHIND} new commit(s)) into \`${TARGET_BRANCH}\` hit conflicts.

          Conflicting files:
          $(printf '%s\n' "$CONFLICTS" | sed 's/^/- `/; s/$/`/')

          Resolve locally:
          \`\`\`sh
          git fetch upstream
          git checkout ${TARGET_BRANCH}
          git merge upstream/${UPSTREAM_BRANCH}
          # fix conflicts, commit, push
          \`\`\`
          Pushing the resolved merge to \`${TARGET_BRANCH}\` closes this PR as merged.
          EOF
          )

          existing=$(gh pr list --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "Updated PR #${existing}"
          else
            gh pr create \
              --head "${SYNC_BRANCH}" \
              --base "${TARGET_BRANCH}" \
              --title "Sync upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} (conflicts)" \
              --body "$body"
          fi
